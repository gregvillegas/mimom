{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-60">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-3 bg-success bg-opacity-10 p-3 mb-3 shadow-sm">
                <i class="bi bi-shield-check fs-1 text-success opacity-75"></i>
            </div>
        </div>
        <h1 class="h3 fw-bold mb-2">Password Changed Successfully</h1>
        <p class="text-muted mb-5">Your password has been updated. Use it the next time you sign in.</p>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <a href="{% url 'accounts:profile_me' %}" class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-person"></i> Go to My Profile
            </a>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary d-inline-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-house"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
