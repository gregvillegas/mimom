{% extends 'base.html' %}
{% block title %}Signed Out{% endblock %}
{% block content %}

    <div class="w-100 text-center" style="max-width: 420px;">
        <div class="mb-4">
            <i class="bi bi-box-arrow-right fs-1 text-success opacity-75"></i>
        </div>
        <h1 class="h3 fw-bold mb-2">You have been signed out</h1>

    </div>
</div>
{% endblock %}
