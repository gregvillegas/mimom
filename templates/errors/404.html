{% extends 'base.html' %}
{% load static %}
{% block title %}404 Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-60">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="mb-4">
            <i class="bi bi-compass fs-1 text-primary opacity-75"></i>
        </div>
        <h1 class="display-4 fw-bold text-muted mb-2">404</h1>
        <h2 class="h4 text-body mb-3">Page Not Found</h2>
        <p class="text-muted mb-5">
            The page you are looking for does not exist or has been moved.
            Check the URL or use the navigation to find what you need.
        </p>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
            <a href="{% url 'home' %}" class="btn btn-primary">
                <i class="bi bi-house me-2"></i> Back to Dashboard
            </a>
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                <i class="bi bi-arrow-left me-2"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
