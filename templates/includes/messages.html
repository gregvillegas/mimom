{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 z-3" style="z-index: 9999;">
    {% for message in messages %}
    <div class="toast align-items-center text-bg-{{ message.tags }} border-0 fade show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                {% if message.level_tag == 'success' %}
                <i class="bi bi-check-circle-fill fs-5"></i>
                {% elif message.level_tag == 'error' %}
                <i class="bi bi-exclamation-octagon-fill fs-5"></i>
                {% elif message.level_tag == 'warning' %}
                <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                {% else %}
                <i class="bi bi-info-circle-fill fs-5"></i>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
