<div class="modal fade" id="transitionModal" tabindex="-1" aria-modal="true" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form method="post" action="{% url 'meetings:meeting_transition' meeting.pk %}" class="modal-content">
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title">Change meeting status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="id_target_status" class="form-label">Move to status</label>
          <select class="form-select" id="id_target_status" name="target_status" required>
            {% for val, label in available_target_statuses %}
              <option value="{{ val }}">{{ label }}</option>
            {% empty %}
              <option disabled>No valid transitions available from this status.</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label for="id_reason" class="form-label">Reason (required for corrections / returns)</label>
          <textarea id="id_reason" name="reason" rows="2" class="form-control"></textarea>
          <div class="form-text">Providing a clear reason creates a permanent entry in meeting status history.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Apply transition</button>
      </div>
    </form>
  </div>
</div>
