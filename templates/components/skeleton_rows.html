{% with count=count|default:1 columns=columns|default:4 %}
{% for i in "x"|rjust:count %}
<div class="row g-4 mb-4">
    {% for j in "x"|rjust:columns %}
    <div class="col-sm-12 col-md-6 col-lg-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex align-items-start justify-content-between mb-2">
                    <div class="loading-skeleton rounded-3" style="width: 48px; height: 48px;"></div>
                    <div class="loading-skeleton rounded-pill" style="width: 70px; height: 20px;"></div>
                </div>
                <div class="loading-skeleton rounded mb-1" style="width: 60%; height: 32px;"></div>
                <div class="loading-skeleton rounded" style="width: 40%; height: 16px;"></div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endfor %}
{% endwith %}
