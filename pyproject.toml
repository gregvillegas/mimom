[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intranet"
version = "0.1.0"
description = "Management Meeting Minutes and Action Tracking System"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<7.0",
    "django-environ>=0.11",
    "django-filter>=24.0",
    "django-tables2>=2.7",
    "whitenoise>=6.6",
    "gunicorn>=22.0",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "WeasyPrint>=62.0",
    "pypdf>=4.0",
    "bleach>=6.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "django-browser-reload>=1.12",
]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["tests*", "venv*", "node_modules*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests/test_*.py", "**/tests.py", "**/test_*.py"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "venv",
    ".venv",
    "migrations",
    "staticfiles",
    "media",
    "node_modules",
    "*.pyc",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults
    "UP007",   # Use X | Y for unions (keep compatible for now)
    "TC001",   # typing import for TYPE_CHECKING (optional: keep relaxed)
    "I002",    # required imports (too noisy for skeleton files)
    "RUF012",  # mutable Meta class defaults (standard Django pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
